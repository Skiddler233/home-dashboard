apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: household-dashboard
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: dashboard.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: household-dashboard
                port:
                  number: 80
